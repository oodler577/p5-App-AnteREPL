name = App-AnteREPL
version = 0.01
author = Brett Estrade
license = Perl_5
copyright_holder = Brett Estrade
copyright_year = 2026

; An explicit release list keeps helpers, wiki pages, build products, and
; unrelated local files out of the CPAN archive. Add new runtime/tests here.
[GatherFile]
filename = Changes
filename = LICENSE
filename = Makefile.PL
filename = README.md
filename = dist.ini
filename = lib/App/AnteREPL.pm
filename = script/anterepl
filename = t/basic.t
filename = t/commands-case.t
filename = t/features.t
filename = t/list.t
filename = t/screen.t
filename = t/semicolons.t

[ExecDir]
dir = script

; Keep the hand-maintained installer so a git checkout also supports cpanm .
[MakeMaker::Runner]
[AutoPrereqs]
skip = ^Term::ReadKey$

[Prereqs]
perl = 5.016

[Prereqs / ConfigureRequires]
ExtUtils::MakeMaker = 6.64

[Prereqs / RuntimeRecommends]
Term::ReadKey = 0

[Prereqs / DevelopRequires]
Dist::Zilla = 6
Dist::Zilla::Plugin::Metadata = 0

[Prereqs / DevelopRecommends]
IO::Pty = 1.20

[MetaResources]
homepage = https://github.com/oodler577/p5-App-AnteREPL/wiki
repository.type = git
repository.url = https://github.com/oodler577/p5-App-AnteREPL.git
repository.web = https://github.com/oodler577/p5-App-AnteREPL
bugtracker.web = https://github.com/oodler577/p5-App-AnteREPL/issues

[MetaNoIndex]
directory = t
package = App::AnteREPL::Screen
package = App::AnteREPL::ScreenInput
package = App::AnteREPL::ScreenOutput
package = App::AnteREPL::Evaluator
namespace = App::AnteREPL::Workspace

; Makefile.PL adds Term::ReadKey as a requirement on native Windows.
[Metadata]
dynamic_config = 1
[MetaJSON]
[MetaYAML]
[Manifest]
[TestRelease]
[ConfirmRelease]
[UploadToCPAN]
